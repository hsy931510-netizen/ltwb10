<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot REST API with AJAX Example</title>
    <!-- Bootstrap 5.2.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 50px;
        }
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            padding: 30px;
            text-align: center;
        }
        #images {
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
            border: 3px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <h2 class="mb-4">Spring Boot REST API with AJAX Example</h2>
            <div>
                <img id="images" width="100" height="100" alt="Avatar" src="/images/default-avatar.png">
            </div>
            <div id="profile" class="mb-4">
                <p class="text-muted">Đang tải thông tin người dùng...</p>
            </div>
            <div>
                <button type="button" id="logout" class="btn btn-danger px-4">Logout</button>
            </div>
        </div>
    </div>

    <!-- jQuery 3.7.1 CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5.2.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JS -->
    <script th:src="@{/js/mainjs.js}" src="/js/mainjs.js"></script>
</body>
</html>
