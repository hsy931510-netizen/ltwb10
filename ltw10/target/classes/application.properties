spring.application.name=JWT_springboot3
server.port=8005

# Cấu hình DataSource MySQL (đọc biến môi trường hoặc dùng mặc định)
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Hsy1507@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình JWT
# Secret key 256-bit chuẩn Base64 (placeholder cho phép ghi đè từ biến môi trường JWT_SECRET_KEY)
security.jwt.secret-key=${JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
# Thời gian sống của token: 1 giờ = 3,600,000 ms
security.jwt.expiration-time=3600000
